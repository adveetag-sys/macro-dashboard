name: Update data

on:
  schedule:
    - cron: "17 3 * * 2-6"    # Tue-Sat 03:17 UTC (08:47 IST): after the US close and FRED's overnight updates
    - cron: "47 10 * * 1-5"   # weekdays 10:47 UTC (16:17 IST): just after Indian markets close
    - cron: "17 14 * * 1-5"   # weekdays 14:17 UTC (19:47 IST): after NSE publishes the day's FII/DII figures
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

concurrency:                   # never two runs at once (e.g. a schedule and a manual click)
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # never let a stuck run hang for hours
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u fetch.py
        timeout-minutes: 12
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # add this once under Settings -> Secrets and variables -> Actions
        continue-on-error: true  # if fetching stalls, still build from the data we already have
      - run: python build.py
      - name: Commit new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
