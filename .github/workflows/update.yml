name: Update data

on:
  schedule:
    - cron: "17 14 * * 1-5"   # weekdays 14:17 UTC (19:47 IST), after Indian markets close
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - run: python build.py
      - name: Commit new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
